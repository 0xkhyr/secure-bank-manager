{% extends 'base.html' %}

{% block title %}Vérification 2FA - SecureBank{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; width: 100%; text-align: center;">
    
    <div class="card shadow border-0" style="width: 100%; max-width: 450px; margin: 0 auto;">
        <div class="card-body p-4 p-md-5" style="text-align: center !important;">
            
            <div style="margin-bottom: 2rem;">
                <div style="background-color: rgba(13, 110, 253, 0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto;">
                    <i class="bi bi-shield-lock text-primary" style="font-size: 2.5rem;"></i>
                </div>
                <h2 style="font-weight: 700; font-size: 1.75rem; margin-bottom: 0.75rem;">Vérification 2FA</h2>
                <p style="color: #6c757d; margin: 0 auto; max-width: 350px;">Saisissez le code à 6 chiffres généré par votre application d'authentification.</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div style="margin-bottom: 2rem;">
                    <input type="text" 
                           name="code" 
                           id="code" 
                           maxlength="6" 
                           required 
                           placeholder="000 000" 
                           autofocus
                           style="width: 100%; height: 70px; font-size: 2rem; text-align: center; font-weight: 700; letter-spacing: 0.5rem; border: 1px solid #ced4da; border-radius: 0.5rem; display: block; margin: 0 auto;"
                           inputmode="numeric" 
                           pattern="\d*">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; height: 60px; font-weight: 700; border-radius: 0.5rem; font-size: 1.1rem;">
                    Vérifier et Continuer <i class="bi bi-arrow-right ms-2"></i>
                </button>

                <div style="margin-top: 1.5rem;">
                    <a href="{{ url_for('auth.mfa_recovery') }}" style="color: #0d6efd; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                        Appareil perdu ? Utiliser un code de secours
                    </a>
                </div>

                <div style="margin-top: 1.5rem;">
                    <a href="{{ url_for('auth.login') }}" style="color: #6c757d; text-decoration: none; font-size: 0.9rem;">
                        <i class="bi bi-arrow-left me-1"></i> Retour à la connexion
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
